<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浮生千年｜歷史人生養成</title>
<meta name="description" content="從商朝至民國隨機投身人間：出生、學藝、工作、交友、婚姻、子女、疾病、死亡，你的一生也可能改變歷史。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 首頁 -->
<section id="home" class="screen">
  <div id="homeArt" class="home-art" aria-hidden="true"></div>
  <div class="home-card">
    <div class="eyebrow">一籤入世 · 一念千年</div>
    <h1>浮生千年</h1>
    <p>倘若你生在另一個時代，會如何度過一生？從商朝到民國，命運替你抽一個年代、一個城鎮、一戶人家。學藝、謀生、交友、成家，面對疾病與戰亂，走到生命盡頭，留下一篇傳記；也許，還改變了歷史。</p>
    <div class="home-actions">
      <button id="btnContinue" class="btn primary hidden">繼續此生</button>
      <button id="btnQuiz" class="btn primary">開始人格測驗</button>
      <button id="btnSkip" class="btn">略過測驗．直接抽籤</button>
      <button id="btnArchive" class="btn ghost">浮生錄</button>
    </div>
    <p class="fine">所有年代隨機降生，沒有關卡，也不須解鎖。</p>
  </div>
</section>

<!-- 人格測驗 -->
<section id="quiz" class="screen hidden paper-screen">
  <div class="paper-card">
    <div class="eyebrow" id="qProgress"></div>
    <h2 id="qText"></h2>
    <div id="qChoices" class="q-choices"></div>
    <p class="fine">人格會影響傾向，不決定命運。這不是心理診斷。</p>
  </div>
</section>

<!-- 抽籤 -->
<section id="draw" class="screen hidden paper-screen">
  <div class="paper-card center">
    <div class="eyebrow">命運之籤</div>
    <h2>此生，落入何時何地？</h2>
    <div id="sticks" class="sticks" aria-hidden="true"></div>
    <div id="fateBox" class="fate"></div>
    <div class="home-actions center">
      <button id="btnDraw" class="btn primary">搖籤</button>
      <button id="btnBegin" class="btn primary hidden">降生此世</button>
    </div>
    <p class="fine">商至民國二十一個時代機率相同，時代之內的每一年也機率相同。</p>
  </div>
</section>

<!-- 主畫面 HUD -->
<section id="game" class="screen hidden">
  <header class="topbar">
    <div class="top-era">
      <div class="seal" id="tSeal">宋</div>
      <div>
        <div class="top-place"><b id="tPlace"></b><span id="tEra"></span></div>
        <div class="top-date"><span id="tYear"></span>　<span id="tGanzhi"></span></div>
      </div>
    </div>
    <div class="top-stats">
      <div class="tstat"><label>年齡</label><b id="tAge"></b></div>
      <div class="tstat bar"><label>健康 <i id="tHp"></i></label><div class="meter hp"><span id="mHp"></span></div></div>
      <div class="tstat bar"><label>心境 <i id="tMood"></i></label><div class="meter mood"><span id="mMood"></span></div></div>
      <div class="tstat"><label id="tCoinLabel">積蓄</label><b id="tMoney"></b></div>
      <div class="tstat"><label>聲望</label><b id="tFame"></b></div>
      <div class="tstat"><label>德行</label><b id="tVirtue"></b></div>
    </div>
    <div class="top-season">
      <div id="tSeason" class="season"></div>
      <div id="tAp" class="ap" title="今年剩餘行動"></div>
      <button id="btnMenu" class="iconbtn" aria-label="離開到首頁">返回</button>
    </div>
  </header>

  <div class="hud">
    <aside class="panel left" aria-label="人物">
      <div class="who">
        <div id="pPortrait" class="pframe"></div>
        <div class="who-t">
          <h3 id="pName"></h3>
          <div id="pJob" class="job"></div>
          <div id="pFamily" class="muted"></div>
          <div id="pTraits" class="muted"></div>
        </div>
      </div>
      <h4>技藝</h4>
      <div id="pSkills" class="skills"></div>
      <h4>身體</h4>
      <div id="pIlls" class="ills"></div>
      <h4>志業</h4>
      <div id="pProjects" class="legacy-list"></div>
    </aside>

    <main class="stage-wrap">
      <div id="stage" class="stage"></div>
      <div id="floaters" class="floaters" aria-live="polite"></div>
      <div id="narr" class="narr"></div>
    </main>

    <aside class="panel right" aria-label="世事">
      <div class="tabs" role="tablist">
        <button data-tab="people" class="tab on" role="tab">親友</button>
        <button data-tab="world" class="tab" role="tab">世事</button>
        <button data-tab="chron" class="tab" role="tab">紀事</button>
        <button data-tab="hist" class="tab" role="tab">史冊</button>
      </div>
      <div id="tabBody" class="tab-body"></div>
    </aside>
  </div>

  <footer class="actions">
    <div id="actBar" class="act-bar"></div>
    <button id="btnYear" class="btn-year"></button>
  </footer>
  <div id="actPop" class="act-pop hidden" role="menu"></div>
</section>

<!-- 結局 -->
<section id="ending" class="screen hidden paper-screen scroll">
  <div class="scrollcard" id="endBody"></div>
</section>

<!-- 浮生錄 -->
<section id="archive" class="screen hidden paper-screen scroll">
  <div class="scrollcard" id="archiveBody"></div>
</section>

<!-- 事件卡 -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="evTitle">
  <div id="evCard" class="ev-card">
    <div id="evTag" class="ev-tag"></div>
    <h3 id="evTitle"></h3>
    <p id="evText"></p>
    <input id="evInput" class="ev-input hidden" maxlength="6" autocomplete="off">
    <div id="evChoices" class="ev-choices"></div>
  </div>
</div>

<noscript><p style="padding:24px">這個遊戲需要啟用 JavaScript。</p></noscript>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/art.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
