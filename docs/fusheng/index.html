<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浮生千年｜歷史人生養成</title>
<meta name="description" content="從商朝至民國隨機投身人間：出生、學藝、工作、交友、婚姻、子女、疾病、死亡，你的一生也可能改變歷史。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 首頁 -->
<section id="home" class="screen ink-screen">
  <div class="home-wrap">
    <img class="home-logo" src="assets/ui/TitleLogo.webp" alt="浮生千年">
    <div class="home-card">
      <div class="eyebrow">一籤入世 · 一念千年</div>
      <p>倘若你生在另一個時代，會如何度過一生？從商朝到民國，命運替你抽一個年代、一個城鎮、一戶人家。學藝、謀生、交友、成家，面對疾病與戰亂，走到生命盡頭，留下一篇傳記；也許，還改變了歷史。</p>
      <div class="home-actions">
        <button id="btnContinue" class="btn primary hidden">繼續此生</button>
        <button id="btnQuiz" class="btn primary">開始人格測驗</button>
        <button id="btnSkip" class="btn">略過測驗．直接抽籤</button>
        <button id="btnArchive" class="btn ghost">浮生錄</button>
        <button id="btnExit" class="btn ghost hidden">離開遊戲</button>
      </div>
      <p class="fine">所有年代隨機降生，沒有關卡，也不須解鎖。</p>
    </div>
  </div>
</section>

<!-- 人格測驗 -->
<section id="quiz" class="screen hidden nl-screen">
  <div class="nl-wrap">
    <div class="plate"><span id="qProgress"></span></div>
    <div class="q-panel"><h2 id="qText"></h2></div>
    <div id="qChoices" class="q-choices"></div>
    <p class="fine center">人格會影響傾向，不決定命運。這不是心理診斷。</p>
  </div>
</section>

<!-- 抽籤 -->
<section id="draw" class="screen hidden nl-screen">
  <div class="nl-wrap center">
    <div class="plate"><span>命運之籤</span></div>
    <h2 class="draw-q">此生，落入何時何地？</h2>
    <div class="tube-wrap" aria-hidden="true">
      <img id="drawStick" class="draw-stick" src="assets/ui/nl_FortuneStick.webp" alt="">
      <img id="tube" class="tube" src="assets/ui/nl_FortuneCylinder.webp" alt="">
    </div>
    <div id="fateBox" class="fate"></div>
    <div class="home-actions center">
      <button id="btnDraw" class="btn primary">搖籤</button>
      <button id="btnBegin" class="btn primary hidden">降生此世</button>
    </div>
    <p class="fine">商至民國二十一個時代機率相同，時代之內的每一年也機率相同。</p>
  </div>
</section>

<!-- 主畫面 HUD -->
<section id="game" class="screen hidden">
  <div id="stage" class="stage" aria-label="場景">
    <img id="sceneImg" class="scene-img" alt="">
    <div id="sceneTags" class="scene-tags"></div>
    <div id="crowd" class="crowd" aria-hidden="true"></div>
    <div id="actors" class="actors"></div>
    <div id="fx" class="fx" aria-hidden="true"></div>
    <div id="floats" class="floats" aria-hidden="true"></div>
    <div id="sceneName" class="scene-name"></div>
  </div>

  <aside class="brand-col" aria-hidden="true">
    <img src="assets/ui/TitleLogo.webp" alt="">
    <div class="brand-sub">中華歷史人生養成</div>
  </aside>

  <header class="topcards">
    <div class="card c-who">
      <img id="tHead" class="head-ring" alt="">
      <div class="who-name"><b id="tName"></b><small id="tFam"></small></div>
      <div class="kv"><label>年齡</label><span id="tAge"></span><label>身分</label><span id="tJob"></span></div>
    </div>
    <div class="card c-era">
      <div class="kv"><label>朝代</label><span id="tEra"></span><label>地點</label><span id="tPlace"></span></div>
    </div>
    <div class="card c-vit">
      <div class="vit"><i class="ic hp">♥</i><label>健康</label><b id="tHp"></b><div class="bar hp"><span id="mHp"></span></div></div>
      <div class="vit"><i class="ic mood">☺</i><label>心情</label><b id="tMood"></b><div class="bar mood"><span id="mMood"></span></div></div>
      <div class="vit"><i class="ic sta">ϟ</i><label>體力</label><b id="tSta"></b><div class="bar sta"><span id="mSta"></span></div></div>
    </div>
    <div class="card c-money"><i class="ic coin">◎</i><label id="tCoinLabel">銀錢</label><b id="tMoney"></b></div>
    <div class="card c-date">
      <div class="season" id="tSeason"></div>
      <div><div id="tDay" class="day"></div><div id="tWeather" class="weather"></div></div>
      <div id="tAp" class="ap" title="今年剩餘行動"></div>
    </div>
  </header>

  <aside class="side left">
    <div class="card list">
      <h4 class="ribbon">當前目標</h4>
      <div id="goals" class="goals"></div>
    </div>
    <div class="card list">
      <h4 class="ribbon">事件提示</h4>
      <div id="hints" class="hints"></div>
    </div>
  </aside>

  <aside class="side right">
    <div class="card list">
      <h4 class="ribbon">能力一覽</h4>
      <div id="skills" class="skills"></div>
    </div>
    <div class="card list">
      <h4 class="ribbon">關係</h4>
      <div id="rels" class="rels"></div>
      <button id="relMore" class="more">更多…</button>
    </div>
  </aside>

  <div id="narr" class="narr" aria-live="polite"></div>

  <nav class="navbar" aria-label="主選單">
    <button class="nav" data-nav="act"><span class="ring"><i class="glyph">行</i></span><b>行動</b></button>
    <button class="nav" data-nav="map"><span class="ring"><img src="assets/ui/ico_map.webp" alt=""></span><b>地圖</b></button>
    <button class="nav" data-nav="char"><span class="ring"><img src="assets/ui/ico_char.webp" alt=""></span><b>人物</b></button>
    <button class="nav" data-nav="family"><span class="ring"><img src="assets/ui/ico_family.webp" alt=""></span><b>家庭</b></button>
    <button class="nav" data-nav="bag"><span class="ring"><img src="assets/ui/ico_bag.webp" alt=""></span><b>行囊</b></button>
    <button class="nav" data-nav="world"><span class="ring"><i class="glyph">世</i></span><b>世事</b></button>
    <button class="nav" data-nav="bio"><span class="ring"><img src="assets/ui/ico_bio.webp" alt=""></span><b>傳記</b></button>
    <button class="nav" data-nav="sys"><span class="ring"><i class="glyph">⚙</i></span><b>系統</b></button>
    <button id="btnYear" class="nav year"><span class="ring"><i class="glyph">歲</i></span><b id="btnYearT">過此一年</b></button>
  </nav>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-card">
      <div class="sheet-head"><h3 id="sheetTitle"></h3><button id="sheetClose" class="x" aria-label="關閉">×</button></div>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>
</section>

<!-- 結局 -->
<section id="ending" class="screen hidden paper-screen scroll">
  <div class="scrollcard" id="endBody"></div>
</section>

<!-- 浮生錄 -->
<section id="archive" class="screen hidden paper-screen scroll">
  <div class="scrollcard" id="archiveBody"></div>
</section>

<!-- 事件卡 -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="evTitle">
  <div id="evCard" class="ev-card">
    <img id="evActor" class="ev-actor" alt="">
    <div class="ev-main">
      <div id="evTag" class="ev-tag"></div>
      <h3 id="evTitle"></h3>
      <p id="evText"></p>
      <input id="evInput" class="ev-input hidden" maxlength="6" autocomplete="off">
      <div id="evChoices" class="ev-choices"></div>
    </div>
  </div>
</div>

<noscript><p style="padding:24px">這個遊戲需要啟用 JavaScript。</p></noscript>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/look.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
